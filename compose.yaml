name: outention-personal

services:
  outention:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .outention/.env.local
        required: false
    environment:
      OUTENTION_MODE: personal
      HOST: 0.0.0.0
      PORT: 4173
      OUTENTION_CONFIG_PATH: /app/data/.env.local
      OUTENTION_CONFIG_LABEL: ./.outention/.env.local
    ports:
      - "127.0.0.1:4173:4173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.outention:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
