<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body class="access-page">
    <main class="access-shell">

          <label for="access-code">Kutsukoodi</label>
          <div><input id="access-code" name="code" type="password" autocomplete="one-time-code" required autofocus /><button type="submit">Avaa beta <span aria-hidden="true">→</span></button></div>

        <p id="access-status" class="connect-status" role="status" aria-live="polite"></p>

    <script type="module" src="src/access.ts"></script>
